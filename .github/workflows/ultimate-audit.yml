name: Ultimate compatibility audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit utility tests
        run: python -m unittest discover -s tools/tests -v
